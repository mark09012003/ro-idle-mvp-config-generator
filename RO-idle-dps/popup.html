<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RO 放置仙境 · 單怪 DPS 試算</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <header>
    <div>
      <h1>單怪 DPS 試算</h1>
      <p id="role">正在讀取目前角色…</p>
    </div>
    <button id="refresh" type="button">更新角色</button>
  </header>
  <form id="calculator">
    <fieldset id="fields" disabled>
      <label for="search">怪物名稱或 ID</label>
      <input id="search" type="search" placeholder="例如：黃金蟲、1086" autocomplete="off">
      <label for="monster">目標怪物</label>
      <select id="monster" required><option value="">請選擇怪物</option></select>
      <div class="grid">
        <label>攻擊方式
          <select id="mode">
            <option value="normal">純普攻</option>
            <option value="skill">指定技能＋普攻</option>
            <option value="auto">依目前掛機施放設定</option>
          </select>
        </label>
        <label>模擬時間
          <select id="seconds">
            <option value="30">30 秒</option>
            <option value="60" selected>60 秒</option>
            <option value="120">120 秒</option>
          </select>
        </label>
      </div>
      <div id="skill-fields" class="grid" hidden>
        <label>攻擊技能 <select id="skill"></select></label>
        <label>技能等級 <select id="skill-level"></select></label>
      </div>
      <label class="check"><input id="counterattack" type="checkbox"> 模擬怪物反擊並計算承傷</label>
      <button id="calculate" type="submit">開始試算</button>
    </fieldset>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="result" hidden aria-label="試算結果">
    <h2 id="target"></h2>
    <p id="monster-stats"></p>
    <dl class="metrics">
      <div><dt>平均 DPS</dt><dd id="dps"></dd></div>
      <div><dt>單隻首殺時間</dt><dd id="ttk"></dd></div>
    </dl>
    <p id="summary"></p>
    <p id="combat-stats"></p>
    <div class="table-scroll">
      <table>
        <thead><tr><th scope="col">傷害來源</th><th scope="col">占比</th><th scope="col">平均詠唱／延遲／冷卻</th></tr></thead>
        <tbody id="damage"></tbody>
      </table>
    </div>
    <section id="defense" hidden aria-label="承傷與生存">
      <h2>承傷與生存</h2>
      <dl class="metrics">
        <div><dt>平均承傷／次</dt><dd id="taken"></dd></div>
        <div><dt>交戰期間承傷／秒</dt><dd id="incoming-dps"></dd></div>
      </dl>
      <p id="survival"></p>
      <p id="incoming-sources"></p>
      <details id="timeline-details">
        <summary id="timeline-title">第 1 次模擬的對戰過程</summary>
        <ol id="timeline"></ol>
      </details>
    </section>
    <details>
      <summary>試算條件</summary>
      <p>以角色快照的 HP、SP、裝備、背包及看得到的 Buff 開始。目標倒下後立刻換上同一隻滿血怪，計入有效傷害。勾選反擊時，雙方在可交戰距離開始。怪物可普攻、施技及打斷詠唱，角色倒下後結束該次模擬。找怪移動、掉落與隊友攻擊不計。隊友給的現有 Buff 會倒數，但模擬中沒有隊友補放。角色戰鬥內部狀態以新遭遇起算。</p>
    </details>
  </section>
</body>
</html>
